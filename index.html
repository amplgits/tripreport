<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Transporting Report</title>
<link rel="icon" type="image/png" href="https://wingzinfotech.in/img/ampl.jpg">
<link rel="apple-touch-icon" href="https://wingzinfotech.in/img/ampl.jpg">
<link rel="manifest" id="manifestLink">
<meta name="theme-color" content="#0E9C8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transport Rpt">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">

<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-alt:#E7ECEB; --surface-hover:#DEE5E3;
  --ink:#101820; --ink-soft:#54626B; --ink-faint:#8B979E;
  --line:#D9DFDD; --line-strong:#C3CBC8;
  --loading:#0E9C8F; --loading-ink:#066358; --loading-soft:rgba(14,156,143,.12);
  --unloading:#E8830F; --unloading-ink:#9A5407; --unloading-soft:rgba(232,131,15,.13);
  --danger:#D64545;
  --shadow:0 1px 2px rgba(16,24,32,.04), 0 8px 24px -12px rgba(16,24,32,.14);
  --shadow-lg:0 20px 48px -16px rgba(16,24,32,.28);
  --radius:14px; --radius-sm:9px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'Inter',system-ui,sans-serif; /* numeric values use the sans body face, not monospace */
  --grad-hero:linear-gradient(120deg,#0E9C8F 0%,#0E7C9E 48%,#E8830F 100%);
}
[data-theme="dark"]{
  --bg:#0A1013; --surface:#111A1F; --surface-alt:#17222A; --surface-hover:#1E2B33;
  --ink:#EAF2F1; --ink-soft:#98A9AC; --ink-faint:#5F7176;
  --line:#233238; --line-strong:#2E4048;
  --loading:#28D6C4; --loading-ink:#8AF0E4; --loading-soft:rgba(40,214,196,.14);
  --unloading:#FFA83D; --unloading-ink:#FFC98A; --unloading-soft:rgba(255,168,61,.15);
  --danger:#F17070;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 24px 56px -18px rgba(0,0,0,.65);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
  overscroll-behavior-y:contain;
}
::selection{background:var(--loading-soft);}
button, input, select{font-family:inherit;}
button,.chip,.ms-trigger,.field select,.field input,.theme-toggle{
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.app{max-width:1180px;margin:0 auto;padding:0 20px 64px;padding-bottom:calc(64px + env(safe-area-inset-bottom));}

.topbar{
  position:sticky; top:0; z-index:40; background:var(--bg);
  padding:20px 0 16px; padding-top:calc(20px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:16px;
  border-bottom:1px solid var(--line); margin-bottom:22px;
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:var(--grad-hero); opacity:.9;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:var(--surface-alt);flex:none;}
.brand-text h1{
  font-family:var(--font-display); font-size:19px; font-weight:700; margin:0;
  letter-spacing:.2px; white-space:nowrap;
}
.brand-text span{font-size:11.5px; color:var(--ink-faint); letter-spacing:.6px; text-transform:uppercase;}

.spacer{flex:1;}

.theme-toggle{
  width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface); cursor:pointer; display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft); transition:background .2s,transform .15s,color .2s; flex:none;
}
.theme-toggle:hover{background:var(--surface-hover); color:var(--ink);}
.theme-toggle:active{transform:scale(.92);}
.theme-toggle svg{width:18px;height:18px;}
.topbar-actions{display:flex; align-items:center; gap:10px;}

/* ============================================================
   COLLAPSIBLE FILTERS PANEL
   ============================================================ */
.filters{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:22px;
  transition:margin-bottom .35s ease, border-color .35s ease, box-shadow .35s ease;
}
.filters.collapsed{
  margin-bottom:0;
  border-color:transparent;
  box-shadow:none;
}
.filters-body{
  overflow:hidden;
  padding:20px 22px;
  transition:height .35s ease, padding-top .35s ease, padding-bottom .35s ease;
}
.filter-row{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end;}
.filter-row + .filter-row{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
.field{display:flex; flex-direction:column; gap:6px; min-width:150px;}
.field label{
  font-size:10.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase;
  color:var(--ink-faint);
}
.field input[type="text"], .field select{
  font-family:var(--font-mono); font-size:14px; padding:9px 12px; border-radius:var(--radius-sm);
  border:1px solid var(--line-strong); background:ALICEBLUE; color:var(--ink);
  outline:none; transition:border-color .15s, box-shadow .15s; cursor:pointer;
  min-width:150px;
}
.field input[type="text"]:focus, .field select:focus{
  border-color:var(--loading); box-shadow:0 0 0 3px var(--loading-soft);
}
.field select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%2354626B' stroke-width='1.5'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:30px; cursor:pointer;}

.mode-group{display:flex; gap:10px;}
.chip{
  display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:999px;
  border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer;
  font-size:13.5px; font-weight:600; color:var(--ink-soft); transition:all .18s;
  user-select:none;
}
.chip input{display:none;}
.chip .swatch{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5;transition:opacity .18s;}
.chip.loading.active{border-color:var(--loading); color:var(--loading-ink); background:var(--loading-soft);}
.chip.loading.active .swatch{opacity:1;}
.chip.unloading.active{border-color:var(--unloading); color:var(--unloading-ink); background:var(--unloading-soft);}
.chip.unloading.active .swatch{opacity:1;}
.chip:hover{border-color:var(--ink-faint);}

.multiselect{position:relative;}
.ms-trigger{
  font-family:var(--font-mono); font-size:14px; padding:9px 30px 9px 12px; border-radius:var(--radius-sm);
  border:1px solid var(--line-strong); background:LIGHTSKYBLUE; color:var(--ink); cursor:pointer;
  min-width:180px; text-align:left; position:relative; transition:border-color .15s;
}
.ms-trigger:disabled, .ms-trigger.disabled{cursor:not-allowed; color:var(--ink-faint); background:var(--surface-alt);}
.ms-trigger:after{
  content:''; position:absolute; right:12px; top:50%; width:8px;height:8px;
  border-right:1.5px solid var(--ink-faint); border-bottom:1.5px solid var(--ink-faint);
  transform:translateY(-65%) rotate(45deg);
}
.ms-trigger:hover{border-color:var(--ink-faint);}
.ms-panel{
  position:absolute; top:calc(100% + 8px); left:0; width:290px; max-height:340px;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg); z-index:50; display:none; flex-direction:column; overflow:hidden;
}
.ms-panel.open{display:flex;}
.ms-search{padding:10px; border-bottom:1px solid var(--line);}
.ms-search input{
  width:100%; padding:7px 10px; font-size:13px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface-alt); color:var(--ink); outline:none; font-family:var(--font-body);
}
.ms-all{padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px; font-weight:600; font-size:13.5px; cursor:pointer;}
.ms-list{overflow-y:auto; padding:6px 4px;}
.ms-item{padding:8px 10px; display:flex; align-items:center; gap:9px; font-size:13.5px; border-radius:7px; cursor:pointer; opacity:1; transition:opacity .15s;}
.ms-item:hover{background:var(--surface-alt);}
.ms-item.disabled{opacity:.4; pointer-events:none;}
.ms-item input, .ms-all input{accent-color:var(--loading); width:15px;height:15px; cursor:pointer;}
.ms-empty{padding:16px; text-align:center; color:var(--ink-faint); font-size:13px;}

/* ============================================================
   SITE SUMMARY CARDS (beside the Party name filter)
   ============================================================ */
.site-cards{display:flex; gap:10px; flex-wrap:wrap;}
.site-card{
  --card-accent: var(--loading);
  background:var(--surface-alt); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:9px 14px; min-width:148px; border-left:3px solid var(--card-accent);
}
.site-card-title{
  font-family:var(--font-display); font-weight:700; font-size:12.5px; letter-spacing:.6px;
  color:var(--ink); margin-bottom:5px; cursor:default;
}
.site-card-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:12px; color:var(--ink-soft);}
.site-card-row + .site-card-row{margin-top:3px;}
.site-card-value{font-family:var(--font-mono); font-weight:700; color:var(--ink); white-space:nowrap;}
.site-card-value .unit{font-size:9.5px; color:var(--ink-faint); font-weight:500;}

.btn{
  font-family:var(--font-body); font-weight:600; font-size:13.5px; padding:10px 18px;
  border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink-soft); cursor:pointer; transition:all .18s; display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{background:var(--surface-hover); color:var(--ink);}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:var(--grad-hero); border:none; color:#fff; box-shadow:var(--shadow);
}
.btn-primary:hover{filter:brightness(1.06); color:#fff;}
.btn svg{width:15px;height:15px;}

.results{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}

.empty-state{padding:70px 24px; text-align:center; color:var(--ink-faint);}
.empty-state svg{width:52px;height:52px; margin-bottom:16px; opacity:.55;}
.empty-state h3{font-family:var(--font-display); font-size:16px; color:var(--ink-soft); margin:0 0 6px;}
.empty-state p{font-size:13.5px; margin:0; max-width:360px; margin-inline:auto; line-height:1.5;}

.table-wrap{
  overflow-x:auto; overflow-y:auto; max-height:64vh;
  -webkit-overflow-scrolling:touch;
}
table{border-collapse:collapse; font-size:13.5px; table-layout:auto;}
thead{position:sticky; top:0; z-index:5;}
thead th{
  text-align:left; padding:11px 14px; font-size:10px; font-weight:700; letter-spacing:.8px;
  text-transform:uppercase; color:var(--ink-faint); background:var(--surface-alt);
  border:1px solid var(--line); white-space:normal; word-break:break-word; line-height:1.35;
  vertical-align:middle;
}
thead th.num{text-align:right;}
thead th.center{text-align:center;}
thead th.site-group-header{
  background:var(--surface-hover); color:var(--ink-soft); font-size:11px; letter-spacing:.5px;
  text-align:center;
}
.group-start{border-left:2px solid var(--line-strong) !important;}
tbody td, tfoot td{padding:11px 14px; border:1px solid var(--line); vertical-align:middle; white-space:nowrap;}
tbody tr:hover td{background:var(--surface-alt);}
.party-cell{
  font-weight:600; font-size:13.5px; border-left:3px solid transparent; position:relative;
  white-space:normal; overflow-wrap:break-word; word-break:break-word; line-height:1.4;
}
.qty{font-family:var(--font-mono); font-weight:600; text-align:right; white-space:nowrap;}
.qty.loading-col{color:var(--loading-ink);}
.qty.unloading-col{color:var(--unloading-ink);}
.qty .unit{font-size:10px; color:var(--ink-faint); font-weight:500; margin-left:3px;}
.qty.blank{color:var(--ink-faint); font-weight:400;}

tfoot td{
  font-weight:700; background:var(--surface-alt);
  border-top:2px solid var(--line-strong);
}
tfoot .total-label{
  font-family:var(--font-display); letter-spacing:.5px; font-size:13px;
}

.table-footer{
  padding:12px 20px; font-size:12px; color:var(--ink-faint); border-top:1px solid var(--line);
  display:flex; justify-content:space-between; background:var(--surface-alt);
}

.toast{
  position:fixed; bottom:24px; bottom:calc(24px + env(safe-area-inset-bottom)); right:24px;
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); padding:14px 18px; display:flex;
  align-items:center; gap:12px; min-width:260px; max-width:calc(100vw - 48px); z-index:100;
  transform:translateY(20px); opacity:0;
  transition:transform .3s ease, opacity .3s ease; pointer-events:none;
}
.toast.show{transform:translateY(0); opacity:1; pointer-events:auto;}
.toast .spin{width:17px;height:17px;border:2.5px solid var(--line-strong); border-top-color:var(--loading); border-radius:50%; animation:spin .7s linear infinite; flex:none;}
.toast.success .spin{border-top-color:var(--loading); animation:none; border:none; width:17px;height:17px;}
.toast.error .spin{border:none;}
.toast p{margin:0; font-size:13px; color:var(--ink); line-height:1.4;}
@keyframes spin{to{transform:rotate(360deg);}}

.flatpickr-calendar{background:var(--surface)!important; border:1px solid var(--line-strong)!important; box-shadow:var(--shadow-lg)!important; border-radius:var(--radius-sm)!important; font-family:var(--font-body)!important;}
.flatpickr-months, .flatpickr-weekdays{background:var(--surface-alt)!important;}
.flatpickr-current-month, .flatpickr-weekday{color:var(--ink)!important;}
.flatpickr-day{color:var(--ink)!important;}
.flatpickr-day.flatpickr-disabled{color:var(--ink-faint)!important;}
.flatpickr-day:hover{background:var(--surface-hover)!important;}
.flatpickr-day.selected{background:var(--loading)!important; border-color:var(--loading)!important; color:#fff!important;}
.flatpickr-day.today{border-color:var(--unloading)!important;}
.numInputWrapper span, .flatpickr-prev-month svg, .flatpickr-next-month svg{fill:var(--ink-soft)!important;}

@media (max-width:720px){
  .app{padding:0 14px 48px; padding-bottom:calc(48px + env(safe-area-inset-bottom));}
  .topbar{flex-wrap:wrap; padding-top:calc(16px + env(safe-area-inset-top));}
  .brand-text span{display:none;}
  .filter-row{gap:12px;}
  .field, .ms-trigger, .field select, .field input{min-width:0; width:100%;}
  thead th{padding:9px 10px;}
  tbody td, tfoot td{padding:9px 10px;}
  .table-wrap{max-height:65vh;}
  .site-cards{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:100%;}
  .site-card{min-width:0;}
  .btn{width:100%; justify-content:center; padding:12px 16px; font-size:14px;}
  .chip{padding:11px 16px; flex:1; justify-content:center;}
  .mode-group{width:100%;}
  .theme-toggle{width:44px; height:44px;}
  .actions-row{flex-direction:column;}
  .actions-row .spacer{display:none;}
  .ms-panel{width:100%; left:0; right:0;}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <img src="https://wingzinfotech.in/img/ampl.jpg" alt="" onerror="this.style.display='none'">
      <div class="brand-text">
        <h1>Transporting Report</h1>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="filtersToggle" title="Collapse filters" aria-label="Collapse filters" aria-expanded="true">
        <svg id="filtersToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <section class="filters" id="filtersSection">
    <div class="filters-body">
      <div class="filter-row">
        <div class="field">
          <label for="dateFrom">From</label>
          <input type="text" id="dateFrom" placeholder="DD/MM/YYYY" autocomplete="off">
        </div>
        <div class="field">
          <label for="dateTo">To</label>
          <input type="text" id="dateTo" placeholder="DD/MM/YYYY" autocomplete="off">
        </div>
        <div class="field">
          <label>Mode</label>
          <div class="mode-group">
            <label class="chip loading" id="chipLoading">
              <input type="checkbox" id="cbLoading"><span class="swatch" style="color:var(--loading)"></span>Loading
            </label>
            <label class="chip unloading" id="chipUnloading">
              <input type="checkbox" id="cbUnloading"><span class="swatch" style="color:var(--unloading)"></span>Unloading
            </label>
          </div>
        </div>
        <div class="field">
          <label>Site</label>
          <div class="multiselect" id="siteMultiselect">
            <button type="button" class="ms-trigger" id="siteTrigger">Select site(s)</button>
            <div class="ms-panel" id="sitePanel">
              <div class="ms-search"><input type="text" id="siteSearch" placeholder="Search site…"></div>
              <label class="ms-all"><input type="checkbox" id="siteAllCb"> All sites</label>
              <div class="ms-list" id="siteList"></div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Party name</label>
          <div class="multiselect" id="partyMultiselect">
            <button type="button" class="ms-trigger disabled" id="partyTrigger">Select a site first</button>
            <div class="ms-panel" id="partyPanel">
              <div class="ms-search"><input type="text" id="partySearch" placeholder="Search party…"></div>
              <label class="ms-all"><input type="checkbox" id="partyAllCb"> All parties</label>
              <div class="ms-list" id="partyList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="filter-row">
        <div class="site-cards" id="siteCards"></div>
      </div>
      <div class="filter-row actions-row">
        <button class="btn" id="clearBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
          Clear filters
        </button>
        <button class="btn" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5M4.5 9a8 8 0 0114.5-3M19.5 15a8 8 0 01-14.5 3"/></svg>
          Refresh
        </button>
        <button class="btn" id="pdfBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M9 15h6M9 18h4"/></svg>
          Download PDF
        </button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="uploadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          Upload Excel
        </button>
      </div>
    </div>
  </section>

  <section class="results">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3h8l4 4v13a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
      <h3>No trips on screen yet</h3>
      <p>Pick a From and To date, choose Loading or Unloading, and select at least one Site to bring up the register.</p>
    </div>
    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table id="reportTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
    <div class="table-footer" id="tableFooter" style="display:none;">
      <span id="footerSummary"></span>
      <span id="lastUpdated"></span>
    </div>
  </section>

</div>

<input type="file" id="fileInput" accept=".xlsx" hidden>
<div class="toast" id="toast"><div class="spin"></div><p id="toastMsg"></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* =================================================================
   CONFIG
   ================================================================= */
const FIREBASE_URL = 'https://projecttrip-b7b47-default-rtdb.asia-southeast1.firebasedatabase.app';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQ2LHsQIIoa5H-anPJW3sTL6yW6S_e1sv1dRIJApMfY5aJigEqAGSEoPYr9R6wIV74/exec';

// How many trips per truck per day counts as "on target" — used to
// compute Target Trips = days in range × TARGET_TRIPS_PER_TRUCK_PER_DAY × trucks.
const TARGET_TRIPS_PER_TRUCK_PER_DAY = 5;

// Known site name → short code shown on the summary cards and as each
// site's column-group header in the table / PDF. Any site not listed
// here falls back to auto-generated initials, so a new site added
// later still gets a reasonable short code automatically.
const SITE_ABBREVIATIONS = {
  'G. BEGUNIA OC PATCH': 'GBOCP',
  'GOURANGDIH EXPANSION OCP': 'GEOCP'
};
function abbreviateSite(name){
  if (SITE_ABBREVIATIONS[name]) return SITE_ABBREVIATIONS[name];
  const initials = (name || '').split(/\s+/)
    .map(w => w.replace(/[^A-Za-z]/g, ''))
    .filter(Boolean)
    .map(w => w[0])
    .join('')
    .toUpperCase();
  return initials || name;
}

function normalizeTruckNo(raw){
  return String(raw || '').toUpperCase().replace(/[\s\-.\/]+/g, '');
}

   SITE MULTISELECT
   Selecting site(s) re-scopes the Party dropdown to only the parties
   that actually operate at the chosen site(s), and defaults the Party
   filter to "All parties" within that new scope.
   ================================================================= */
const siteTrigger = document.getElementById('siteTrigger');
const sitePanel = document.getElementById('sitePanel');
const siteList = document.getElementById('siteList');
const siteAllCb = document.getElementById('siteAllCb');
const siteSearch = document.getElementById('siteSearch');

siteTrigger.addEventListener('click', () => sitePanel.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!document.getElementById('siteMultiselect').contains(e.target)) sitePanel.classList.remove('open');
});

function renderSiteList(filterText){
  const q = (filterText || '').trim().toUpperCase();
  siteList.innerHTML = '';
  const isAll = filterState.sites.has('ALL');
  const matches = uniqueSites.filter(s => s.toUpperCase().includes(q));
  if (!matches.length){
    siteList.innerHTML = '<div class="ms-empty">No sites match</div>';
    return;
  }
  matches.forEach(site => {
    const row = document.createElement('label');
    row.className = 'ms-item' + (isAll ? ' disabled' : '');
    const checked = !isAll && filterState.sites.has(site);
    row.innerHTML = `<input type="checkbox" data-site="${escapeHtml(site)}" ${checked ? 'checked' : ''}> ${escapeHtml(site)}`;
    siteList.appendChild(row);
  });
  siteList.querySelectorAll('input[data-site]').forEach(cb => {
    cb.addEventListener('change', () => {
      const s = cb.getAttribute('data-site');
      if (cb.checked) filterState.sites.add(s); else filterState.sites.delete(s);
      filterState.sites.delete('ALL');
      onSiteSelectionChanged();
    });
  });
}
siteAllCb.addEventListener('change', () => {
  filterState.sites = siteAllCb.checked ? new Set(['ALL']) : new Set();
  renderSiteList(siteSearch.value);
  onSiteSelectionChanged();
});
siteSearch.addEventListener('input', () => renderSiteList(siteSearch.value));

function updateSiteTriggerLabel(){
  if (filterState.sites.has('ALL')) siteTrigger.textContent = 'All sites';
  else if (filterState.sites.size === 0) siteTrigger.textContent = 'Select site(s)';
  else if (filterState.sites.size === 1) siteTrigger.textContent = abbreviateSite([...filterState.sites][0]);
  else siteTrigger.textContent = filterState.sites.size + ' sites selected';
}

function onSiteSelectionChanged(){
  updateSiteTriggerLabel();
  computePartyOptionsForSites();
  // default to "all parties" within the newly selected site scope
  filterState.parties = uniqueParties.length ? new Set(['ALL']) : new Set();
  partyAllCb.checked = filterState.parties.has('ALL');
  renderPartyList(partySearch.value);
  updatePartyTriggerLabel();
  updatePartyEnabledState();
  applyFilters();
}

   PARTY MULTISELECT (options scoped to the selected site(s))
   ================================================================= */

const partyPanel = document.getElementById('partyPanel');
const partyList = document.getElementById('partyList');
const partyAllCb = document.getElementById('partyAllCb');
const partySearch = document.getElementById('partySearch');

partyTrigger.addEventListener('click', () => {

  partyPanel.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!document.getElementById('partyMultiselect').contains(e.target)) partyPanel.classList.remove('open');
});

function computePartyOptionsForSites(){
  const parties = new Set();
  allTrips.forEach(t => {
    if (!t.party) return;
    if (filterState.sites.has('ALL') || filterState.sites.has(t.source)) parties.add(t.party);
  });
  uniqueParties = [...parties].sort();
}

  const q = (filterText || '').trim().toUpperCase();
  partyList.innerHTML = '';
  const isAll = filterState.parties.has('ALL');
  const matches = uniqueParties.filter(p => p.toUpperCase().includes(q));
  if (!matches.length){
    partyList.innerHTML = `<div class="ms-empty">${filterState.sites.size === 0 ? 'Select a site first' : 'No parties match'}</div>`;
    return;
  }
  matches.forEach(party => {
    const row = document.createElement('label');
    row.className = 'ms-item' + (isAll ? ' disabled' : '');
    const checked = !isAll && filterState.parties.has(party);
    row.innerHTML = `<input type="checkbox" data-party="${escapeHtml(party)}" ${checked ? 'checked' : ''}> ${escapeHtml(party)}`;
    partyList.appendChild(row);

  partyList.querySelectorAll('input[data-party]').forEach(cb => {
    cb.addEventListener('change', () => {
      const p = cb.getAttribute('data-party');
      if (cb.checked) filterState.parties.add(p); else filterState.parties.delete(p);
      filterState.parties.delete('ALL');
      updatePartyTriggerLabel();
      applyFilters();

  else if (filterState.parties.size === 1) partyTrigger.textContent = [...filterState.parties][0];

   ================================================================= */
async function loadData(){
  try{
    const res = await fetch(FIREBASE_URL + '/trips.json');
    const json = await res.json();
    allTrips = json ? Object.keys(json).map(k => Object.assign({ id: k }, json[k])) : [];
    computeFilterOptions();
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    applyFilters();
  } catch(err){
    console.error('Failed to load Firebase data', err);
  }
}

function computeFilterOptions(){
  const sites = new Set();
  allTrips.forEach(t => { if (t.source) sites.add(t.source); });
  uniqueSites = [...sites].sort();

  renderSiteList(siteSearch.value);
  updateSiteTriggerLabel();

  computePartyOptionsForSites();
  renderPartyList(partySearch.value);
  updatePartyTriggerLabel();
  updatePartyEnabledState();

  renderSiteCards();
}

/* =================================================================
   SITE SUMMARY CARDS
   ================================================================= */
/**
 * One card per SELECTED site (not every site), showing Trip Count and
 * Quantity, always covering every party at that site regardless of the
 * Party filter.
 *
 * Cards require a full date range (From + To), a Mode, AND at least
 * one Site to be selected. Until then, no cards render at all.
 */
function renderSiteCards(){
  const container = document.getElementById('siteCards');
  if (!container) return;
  container.innerHTML = '';
  if (!uniqueSites.length) return;

  const gateOpen = filterState.from && filterState.to && filterState.mode && filterState.sites.size > 0;
  if (!gateOpen) return;

  const sitesToShow = filterState.sites.has('ALL')
    ? uniqueSites
    : uniqueSites.filter(s => filterState.sites.has(s));
  if (!sitesToShow.length) return;

  const fromMs = new Date(filterState.from.getFullYear(), filterState.from.getMonth(), filterState.from.getDate()).getTime();
  const toMs = new Date(filterState.to.getFullYear(), filterState.to.getMonth(), filterState.to.getDate()).getTime();
  const dateField = filterState.mode === 'loading' ? 'loadingKey' : 'unloadingKey';
  const qtyField = filterState.mode === 'loading' ? 'loadingQty' : 'unloadingQty';
  const modeWord = filterState.mode === 'loading' ? 'Loading' : 'Unloading';

  sitesToShow.forEach(site => {
    let trips = 0, qty = 0;

    allTrips.forEach(t => {
      if (t.source !== site) return;
      const key = t[dateField];
      if (!key) return;
      const ms = keyToDate(key).getTime();
      if (ms < fromMs || ms > toMs) return;
      trips += 1;
      qty += (t[qtyField] || 0);
    });

    const hue = hashHue(site);
    const card = document.createElement('div');
    card.className = 'site-card';
    card.style.setProperty('--card-accent', `hsl(${hue},55%,45%)`);
    card.innerHTML = `
      <div class="site-card-title" title="${escapeHtml(site)}">${escapeHtml(abbreviateSite(site))}</div>
      <div class="site-card-row"><span>${modeWord} Trips</span><span class="site-card-value">${trips}</span></div>
      <div class="site-card-row"><span>${modeWord} Total qty</span><span class="site-card-value">${qty.toFixed(2)}<span class="unit"> MT</span></span></div>
    `;
    container.appendChild(card);
  });
}

/* =================================================================
   FILTER + RENDER
   ================================================================= */
function keyToDate(key){ const [d,m,y] = key.split('/').map(Number); return new Date(y, m-1, d); }

function applyFilters(){
  renderSiteCards();

  const emptyState = document.getElementById('emptyState');
  const tableWrap = document.getElementById('tableWrap');
  const tableFooter = document.getElementById('tableFooter');

  // At least one Site must be selected (specific site(s) or "All sites")
  // for the register to appear at all.
  const gateOpen = filterState.from && filterState.to && filterState.mode && filterState.sites.size > 0;
  if (!gateOpen){
    emptyState.querySelector('h3').textContent = 'No trips on screen yet';
    emptyState.querySelector('p').textContent = 'Pick a From and To date, choose Loading or Unloading, and select at least one Site to bring up the register.';
    emptyState.style.display = 'block';
    tableWrap.style.display = 'none';
    tableFooter.style.display = 'none';
    lastReportModel = null;
    return;
  }

  const fromMs = new Date(filterState.from.getFullYear(), filterState.from.getMonth(), filterState.from.getDate()).getTime();
  const toMs = new Date(filterState.to.getFullYear(), filterState.to.getMonth(), filterState.to.getDate()).getTime();
  const dateField = filterState.mode === 'loading' ? 'loadingKey' : 'unloadingKey';

  const filtered = allTrips.filter(t => {
    const key = t[dateField];
    if (!key) return false;
    const ms = keyToDate(key).getTime();
    if (ms < fromMs || ms > toMs) return false;
    if (!filterState.sites.has('ALL') && !filterState.sites.has(t.source)) return false;
    if (!filterState.parties.has('ALL') && !filterState.parties.has(t.party)) return false;
    return true;
  });

  if (!filtered.length){
    emptyState.querySelector('h3').textContent = 'No trips match these filters';
    emptyState.querySelector('p').textContent = 'Try widening the date range or adjusting the Site/Party filters.';
    emptyState.style.display = 'block';
    tableWrap.style.display = 'none';
    tableFooter.style.display = 'none';
    lastReportModel = null;
    return;
  }

  emptyState.style.display = 'none';
  tableWrap.style.display = 'block';
  tableFooter.style.display = 'flex';
  renderTable(filtered);

  const totalLoad = filtered.reduce((s,t) => s + (t.loadingQty || 0), 0);
  const totalUnload = filtered.reduce((s,t) => s + (t.unloadingQty || 0), 0);
  document.getElementById('footerSummary').textContent =
    `${totalLoad.toFixed(2)} MT loaded  ·  ${totalUnload.toFixed(2)} MT unloaded`;
}

/**
 * Builds the pivoted report model behind the table and the PDF export:
 * one row per PARTY, with a repeating group of columns for each site
 * currently in scope, followed by aggregate Total trips / Total qty /
 * Target % columns.
 *
 * Only the FIRST site column carries Fleet + Target trips — every
 * subsequent site column only carries Trips + Qty. Target trips (site
 * 1 only) = days in range × 4 × unique trucks that party ran at that
 * first site.
 *
 * Target % (per party, and for the grand total) =
 * (Total trips ÷ first site's Target trips) × 100, where Total trips
 * is still summed across every site column for that row, but the
 * denominator comes only from the first site — there's no more
 * "Total target trips" aggregate.
 *
 * "Sites in scope" is ordered to match the order the user picked
 * sites in the Site filter — so the first column is always whichever
 * site was selected FIRST, not the alphabetically-first one. It falls
 * back to alphabetical order only when "All sites" is chosen (there's
 * no explicit pick order in that case) or for a site present in the
 * data but outside that selection order.
 */
function buildReportModel(rows){
  const mode = filterState.mode;
  const qtyField = mode === 'loading' ? 'loadingQty' : 'unloadingQty';
  const qtyLabel = mode === 'loading' ? 'Loading qty' : 'Unloading qty';
  const qtyColorClass = mode === 'loading' ? 'loading-col' : 'unloading-col';

  const fromD = filterState.from, toD = filterState.to;
  const fromMid = new Date(fromD.getFullYear(), fromD.getMonth(), fromD.getDate());
  const toMid = new Date(toD.getFullYear(), toD.getMonth(), toD.getDate());
  const days = Math.max(1, Math.round((toMid - fromMid) / 86400000) + 1);

  const dataSites = new Set(rows.map(r => r.source || '(No site)'));
  let sitesInScope;
  if (filterState.sites.has('ALL')){
    sitesInScope = [...dataSites].sort();
  } else {
    const selectedOrder = [...filterState.sites].filter(s => dataSites.has(s));
    const remaining = [...dataSites].filter(s => !selectedOrder.includes(s)).sort();
    sitesInScope = selectedOrder.concat(remaining);
  }

  // party -> site -> { trips, qty, trucks:Set }
  const partyMap = new Map();
  rows.forEach(r => {
    const party = r.party || '(No party)';
    const site = r.source || '(No site)';
    if (!partyMap.has(party)) partyMap.set(party, new Map());
    const siteMap = partyMap.get(party);
    if (!siteMap.has(site)) siteMap.set(site, { trips: 0, qty: 0, trucks: new Set() });
    const cell = siteMap.get(site);
    cell.trips += 1;
    cell.qty += (r[qtyField] || 0);
    if (r.truckNo) cell.trucks.add(normalizeTruckNo(r.truckNo));
  });

  const partyRows = [...partyMap.keys()].sort((a, b) => a.localeCompare(b)).map(party => {
    const siteMap = partyMap.get(party);
    const siteCells = sitesInScope.map(site => {
      const c = siteMap.get(site) || { trips: 0, qty: 0, trucks: new Set() };
      return { site, trips: c.trips, qty: c.qty };
    });

    // Fleet = distinct trucks this party ran across EVERY site currently
    // in scope, not just the first site.
    const fleetTrucks = new Set();
    sitesInScope.forEach(site => {
      const c = siteMap.get(site);
      if (c) c.trucks.forEach(t => fleetTrucks.add(t));
    });
    const fleet = fleetTrucks.size;
    const targetTrips = days * TARGET_TRIPS_PER_TRUCK_PER_DAY * fleet;

    const totalTrips = siteCells.reduce((s, c) => s + c.trips, 0);
    const totalQty = siteCells.reduce((s, c) => s + c.qty, 0);
    const targetPct = targetTrips ? (totalTrips / targetTrips) * 100 : 0;
    return { party, siteCells, fleet, targetTrips, totalTrips, totalQty, targetPct };
  });

  // Grand total row: Fleet = distinct trucks across ALL parties and ALL
  // sites in scope (a truck serving multiple parties/sites counted once).
  const totalSiteCells = sitesInScope.map(site => {
    let trips = 0, qty = 0;
    rows.forEach(r => {
      if ((r.source || '(No site)') !== site) return;
      trips += 1;
      qty += (r[qtyField] || 0);
    });
    return { site, trips, qty };
  });

  const grandFleetTrucks = new Set();
  rows.forEach(r => { if (r.truckNo) grandFleetTrucks.add(normalizeTruckNo(r.truckNo)); });
  const grandFleet = grandFleetTrucks.size;
  const grandTargetTrips = days * TARGET_TRIPS_PER_TRUCK_PER_DAY * grandFleet;
  const grandTrips = rows.length;
  const grandQty = rows.reduce((s, r) => s + (r[qtyField] || 0), 0);
  const grandTargetPct = grandTargetTrips ? (grandTrips / grandTargetTrips) * 100 : 0;

  return {
    mode, qtyLabel, qtyColorClass, sitesInScope, partyRows,
    totals: {
      siteCells: totalSiteCells,
      fleet: grandFleet,
      targetTrips: grandTargetTrips,
      trips: grandTrips,
      qty: grandQty,
      targetPct: grandTargetPct
    }
  };
}

function renderTable(rows){
  const model = buildReportModel(rows);
  lastReportModel = model;
  const { qtyLabel, qtyColorClass, sitesInScope } = model;

  /* ---- HEADER: Party name | [Site group] repeated (1st site: 4 cols, rest: 2 cols) | Totals ×3 ----
     There is no spanning "Sites" cell any more — the site name sits directly
     above only its Trips + Qty columns, and never above Fleet / Target trips. ---- */
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '';

  const headRow1 = document.createElement('tr');
  headRow1.innerHTML = `
    <th rowspan="2">Party name</th>
    <th rowspan="2" class="num group-start">Fleet</th>
    <th rowspan="2" class="num">Target trips</th>
    ${sitesInScope.map(site => `
      <th colspan="2" class="site-group-header group-start">${escapeHtml(abbreviateSite(site))}</th>
    `).join('')}
    <th rowspan="2" class="num group-start">Total trips</th>
    <th rowspan="2" class="num">Total ${qtyLabel}</th>
    <th rowspan="2" class="num">Target %</th>
  `;
  thead.appendChild(headRow1);

  const headRow2 = document.createElement('tr');
  headRow2.innerHTML = sitesInScope.map(() => `
    <th class="num group-start">Trips</th>
    <th class="num">${qtyLabel}</th>
  `).join('');
  thead.appendChild(headRow2);

  /* ---- BODY: one row per party ---- */
  const body = document.getElementById('tableBody');
  body.innerHTML = '';
  model.partyRows.forEach(pr => {
    const hue = hashHue(pr.party);
    const siteCellsHtml = pr.siteCells.map(c => `
      <td class="qty group-start">${c.trips}</td>
      <td class="qty ${qtyColorClass}">${c.qty.toFixed(2)}<span class="unit">MT</span></td>
    `).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="party-cell" style="border-left-color:hsl(${hue},55%,45%)">${escapeHtml(pr.party)}</td>
      <td class="qty group-start">${pr.fleet}</td>
      <td class="qty">${pr.targetTrips}</td>
      ${siteCellsHtml}
      <td class="qty group-start">${pr.totalTrips}</td>
      <td class="qty ${qtyColorClass}">${pr.totalQty.toFixed(2)}<span class="unit">MT</span></td>
      <td class="qty">${pr.targetPct.toFixed(1)}<span class="unit">%</span></td>
    `;
    body.appendChild(tr);
  });

  /* ---- TOTAL ROW ---- */
  const totalSiteCellsHtml = model.totals.siteCells.map(c => `
    <td class="qty group-start">${c.trips}</td>
    <td class="qty ${qtyColorClass}">${c.qty.toFixed(2)}<span class="unit">MT</span></td>
  `).join('');
  document.getElementById('tableFoot').innerHTML = `
    <tr>
      <td class="party-cell total-label">TOTAL</td>
      <td class="qty group-start">${model.totals.fleet}</td>
      <td class="qty">${model.totals.targetTrips}</td>
      ${totalSiteCellsHtml}
      <td class="qty group-start">${model.totals.trips}</td>
      <td class="qty ${qtyColorClass}">${model.totals.qty.toFixed(2)}<span class="unit">MT</span></td>
      <td class="qty">${model.totals.targetPct.toFixed(1)}<span class="unit">%</span></td>
    </tr>
  `;
}

function hashHue(str){
  let h = 0;
  for (let i = 0; i < (str || '').length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDMY(d){
  const dd = ('0' + d.getDate()).slice(-2);
  const mm = ('0' + (d.getMonth() + 1)).slice(-2);
  return `${dd}/${mm}/${d.getFullYear()}`;
}

/* =================================================================
   PDF EXPORT
   ================================================================= */
/**
 * Builds jsPDF-autoTable head/body/foot arrays directly from the same
 * report model the on-screen table renders from — so the PDF always
 * matches the interface exactly, column for column, including the
 * "first site only" Fleet/Target trips rule.
 *
 * Two header rows only (no spanning "Sites" cell): the site name sits
 * directly above just its Trips + Qty columns, matching the frontend.
 */
function buildPdfHeadBodyFoot(model){
  const { sitesInScope, qtyLabel, partyRows, totals } = model;

  const headRow1 = [
    { content: 'Party name', rowSpan: 2, styles: { valign: 'middle' } },
    { content: 'Fleet', rowSpan: 2, styles: { valign: 'middle' } },
    { content: 'Target trips', rowSpan: 2, styles: { valign: 'middle' } }
  ];
  sitesInScope.forEach(site => {
    headRow1.push({ content: abbreviateSite(site), colSpan: 2, styles: { halign: 'center' } });
  });
  headRow1.push(
    { content: 'Total trips', rowSpan: 2, styles: { valign: 'middle' } },
    { content: 'Total ' + qtyLabel, rowSpan: 2, styles: { valign: 'middle' } },
    { content: 'Target %', rowSpan: 2, styles: { valign: 'middle' } }
  );

  const headRow2 = [];
  sitesInScope.forEach(() => headRow2.push({ content: 'Trips' }, { content: qtyLabel }));

  const head = [headRow1, headRow2];

  const body = partyRows.map(pr => {
    const row = [pr.party, String(pr.fleet), String(pr.targetTrips)];
    pr.siteCells.forEach(c => row.push(String(c.trips), c.qty.toFixed(2) + ' MT'));
    row.push(String(pr.totalTrips), pr.totalQty.toFixed(2) + ' MT', pr.targetPct.toFixed(1) + '%');
    return row;
  });

  const footRow = ['TOTAL', String(totals.fleet), String(totals.targetTrips)];
  totals.siteCells.forEach(c => footRow.push(String(c.trips), c.qty.toFixed(2) + ' MT'));
  footRow.push(String(totals.trips), totals.qty.toFixed(2) + ' MT', totals.targetPct.toFixed(1) + '%');

  return { head, body, foot: [footRow] };
}

function computePdfReduceMap(numSites){
  const map = [false, false, true]; // Party name, Fleet, Target trips*
  for (let i = 0; i < numSites; i++){
    map.push(false, true); // Trips, Qty*  (each site)
  }
  map.push(true, true, true); // Total trips*, Total qty*, Target %*
  return map;
}

document.getElementById('pdfBtn').addEventListener('click', () => {
  if (!lastReportModel){
    showToast('Apply filters to bring up the table before exporting.', 'error');
    return;
  }
  if (typeof window.jspdf === 'undefined'){
    showToast('PDF library failed to load — check your connection and try again.', 'error');
    return;
  }

  const { jsPDF } = window.jspdf;
  const { head, body, foot } = buildPdfHeadBodyFoot(lastReportModel);
  const numCols = body[0] ? body[0].length : 4;
  const reduceMap = computePdfReduceMap(lastReportModel.sitesInScope.length);

  const sharedTableOptions = {
    theme: 'grid',
    styles: {
      fontSize: 7.5, cellPadding: 4, textColor: [16, 24, 32],
      lineWidth: 0.5, lineColor: [140, 150, 150] // explicit grid lines so every cell is boxed, matching the frontend
    },
    headStyles: {
      fillColor: [231, 236, 235], textColor: [16, 24, 32], fontStyle: 'bold', fontSize: 7.5,
      lineWidth: 0.5, lineColor: [140, 150, 150], halign: 'center'
    },
    alternateRowStyles: { fillColor: [247, 249, 248] },
    footStyles: {
      fillColor: [222, 229, 227], textColor: [16, 24, 32], fontStyle: 'bold',
      lineWidth: 0.5, lineColor: [140, 150, 150]
    },
    columnStyles: { 0: { cellWidth: 110 } }, // Party name a bit wider; unchanged, exactly as before
    didParseCell: (data) => {
      // Every column's data except Party name (column 0) is right-aligned;
      // header labels keep their own alignment (center, as set above).
      if (data.column.index !== 0 && data.row.section !== 'head'){
        data.cell.styles.halign = 'right';
      }
    }
  };

  /* ---- Pass 1 (measurement only — this table is never saved or shown):
     lay the report out exactly as it renders today (full-width auto
     layout) and read back the width autoTable computed for every column,
     via willDrawCell. That's "the current column length" the instruction
     means to preserve for every column that isn't on the reduce list. ---- */
  const measureDoc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const naturalWidths = new Array(numCols).fill(null);
  measureDoc.autoTable(Object.assign({}, sharedTableOptions, {
    head, body, foot,
    willDrawCell: (data) => {
      if (data.row.section === 'body' && naturalWidths[data.column.index] == null){
        naturalWidths[data.column.index] = data.cell.width;
      }
    }
  }));
  // Safety net only — every column should always appear in a body cell.
  for (let i = 0; i < numCols; i++){
    if (naturalWidths[i] == null) naturalWidths[i] = i === 0 ? 110 : 45;
  }

  /* ---- Pass 2 — the real export: same widths, except every column on
     the reduce list is shrunk to 85% of its natural width. tableWidth:
     'wrap' stops autoTable from stretching the now-narrower table back
     out to fill the page — whatever space that frees up is simply left
     blank/white rather than being redistributed to other columns. ---- */
  const columnStyles = {};
  for (let i = 0; i < numCols; i++){
    columnStyles[i] = { cellWidth: reduceMap[i] ? naturalWidths[i] * 0.85 : naturalWidths[i] };
  }

  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });

  const siteLabel = filterState.sites.has('ALL')
    ? 'All Sites'
    : filterState.sites.size === 0
      ? '—'
      : filterState.sites.size <= 3
        ? [...filterState.sites].map(abbreviateSite).join(', ')
        : filterState.sites.size + ' sites';
  const dateLabel = (filterState.from && filterState.to)
    ? `${formatDMY(filterState.from)} – ${formatDMY(filterState.to)}`
    : 'All dates';
  const modeLabel = filterState.mode === 'loading' ? 'Loading' : filterState.mode === 'unloading' ? 'Unloading' : '—';

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(16, 24, 32);
  doc.text('Transporting Report', 40, 42);

  // highlighted Site + Date band, echoing the app's own loading/unloading colors
  doc.setFillColor(14, 156, 143);
  doc.roundedRect(40, 58, 230, 26, 4, 4, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(11);
  doc.text(`SITE: ${siteLabel}`, 52, 75);

  doc.setFillColor(232, 131, 15);
  doc.roundedRect(282, 58, 260, 26, 4, 4, 'F');
  doc.text(`DATE: ${dateLabel}`, 294, 75);

  doc.setTextColor(84, 98, 107);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(`Mode: ${modeLabel}`, 40, 102);

  doc.autoTable(Object.assign({}, sharedTableOptions, {
    head, body, foot,
    startY: 116,
    showFoot: 'lastPage', // Total row only at the end of the last page, not repeated per page
    tableWidth: 'wrap',   // don't stretch to fill the page — leftover space stays blank/white
    columnStyles
  }));

  const fileDate = new Date().toISOString().slice(0, 10);
  doc.save(`transporting-report_${fileDate}.pdf`);
});

/* =================================================================
   UPLOAD
   ================================================================= */
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

uploadBtn.addEventListener('click', () => {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0){
    showToast('Apps Script URL is not configured yet — see SETUP_GUIDE.md.', 'error');
    return;
  }
  fileInput.click();
});

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file) return;

  showToast('Uploading ' + file.name + '…', 'loading');
  try{
    const base64 = await fileToBase64(file);
    const payload = JSON.stringify({
      action: 'upload',
      fileName: file.name,
      mimeType: file.type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      data: base64
    });
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: payload });
    const result = await res.json();
    if (result.success){
      showToast('Slip uploaded. Refreshing dashboard…', 'success');
      setTimeout(loadData, 1500);
    } else {
      showToast('Upload failed: ' + (result.error || 'unknown error'), 'error');
    }
  } catch(err){
    console.error(err);
    showToast('Upload failed — check your connection and try again.', 'error');
  }
});

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let toastTimer = null;
function showToast(msg, kind){
  clearTimeout(toastTimer);
  toastMsg.textContent = msg;
  toast.className = 'toast show' + (kind === 'success' ? ' success' : kind === 'error' ? ' error' : '');
  if (kind !== 'loading'){
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4200);
  }
}

/* =================================================================
   INIT
   ================================================================= */
loadData();
</script>
